name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          enable-cache: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          
      - name: Install dependencies
        run: uv sync --directory mcp-server
        
      - name: Run Python tests
        run: uv run --directory mcp-server pytest ../test_installer.py test_server.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .pi/extensions/tempo-mcp/package-lock.json

      - name: Run Pi extension checks
        working-directory: .pi/extensions/tempo-mcp
        run: |
          npm ci
          npm run check
